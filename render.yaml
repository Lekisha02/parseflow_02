services:
  - type: web
    name: parseflow
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: PARSEFLOW_WORKERS
        value: "1"
      - key: PARSEFLOW_ISOLATE
        value: "0"
      - key: PARSEFLOW_RESUME
        value: "0"
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: PARSEFLOW_DATA_DIR
        value: /data
      - key: PARSEFLOW_SECURE_COOKIE
        value: "1"
      - key: PARSEFLOW_TRUST_PROXY
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
      - key: ASK_PROVIDER
        value: "gemini"
      - key: ASK_MODEL
        value: "gemini-3.5-flash-lite"
      - key: ASK_VISION_MODEL
        value: "gemini-3.5-flash-lite"
