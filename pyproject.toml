[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "parseflow"
version = "2.6.0"
description = "Evidence-preserving document intelligence: PDF/image -> structured Digital Twin JSON + Markdown (offline-first)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "pytesseract>=0.3.10",
    "pillow>=10.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "fonttools>=4.40",
    "httpx>=0.27",
    "python-docx>=1.0",
    "python-pptx>=0.6.21",
    "openpyxl>=3.1",
    "markdown>=3.4",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9", "httpx>=0.27"]
test = ["pytest>=7.4", "httpx>=0.27", "fastapi>=0.110", "python-multipart>=0.0.9"]

[project.scripts]
parseflow = "backend.cli:main"

[tool.setuptools]
packages = ["backend", "backend.processing"]

[tool.setuptools.package-data]
"backend.processing" = ["data/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ocr: needs the tesseract binary",
    "slow: slower integration tests",
    "bench: needs the olmocr checkout + bundled sample data (OLMOCR_PATH)",
    "live: calls a real language model (PARSEFLOW_LIVE_LLM=1 and ASK_PROVIDER configured)",
]

[tool.vercel]
entrypoint = "backend.app:app"
